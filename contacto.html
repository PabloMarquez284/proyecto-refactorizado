<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Sitio Web - Sobre mí</title>
        <link rel="stylesheet" href="scss/main.css">
    </head>
    <body>
        
        <header>
            <h1>Mi Portfolio Personal</h1>
            <p>Desarrollador Web en formación</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre.html">Sobre mí</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
    
        <main>
            <section class="caja-contenido"> <!--Esta sección contiene el formulario de contacto-->
                <h2>¿Tienes alguna pregunta? ¡Envíanos un mensaje!</h2>
                
                <label for="nombre"><b>Nombre:</b></label>
                <input class="form" type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos"><br><br>
                
                <label for="email"><b>Correo electrónico:</b></label>
                <input class="form" type="text" id="email" name="email" placeholder="Email"><br><br>
                
                <label for="asunto"><b>Asunto:</b></label>
                <input class="form" type="text" id="asunto" name="asunto" placeholder="Escribe un tema"><br><br>
                
                <label for="mensaje"><b>Mensaje:</b></label><br>
                <textarea class="form" name="message" rows="10" cols="80" placeholder="Escribe aquí tu mensaje"></textarea><br><br>
                
                <label for="boton de envio"><b>Botón de envío:</b></label>
                <button class="boton" type="button"  onclick="alert('Formulario enviado correctamente')">Enviar</button><br>
            </section>

            <footer>
                <p>&copy; 2025 Mi Portfolio Personal. Todos los derechos reservados.</p>
                <p class="copy-peq">Diseñado (con mucho caos) para la clase de DIW.</p>
            </footer>

        </main>
    </body>
</html>
